[THRESHOLDS]
confidence_threshold = 0.6
high_precision_threshold = 0.8
high_recall_threshold = 0.4

[WEIGHTS]
name_similarity_weight = 0.4
email_prefix_weight = 0.2
name_parts_weight = 0.2
pattern_matching_weight = 0.1
domain_match_weight = 0.05
institutional_weight = 0.05

[INSTITUTIONAL_DOMAINS]
domains = microsoft.com,plainconcepts.com,github.com,google.com,apple.com

[OUTPUT]
save_all_results = true
save_clusters = true
create_visualizations = false
output_format = csv

[LOGGING]
level = INFO
file = deduplication.log